services:
  mongodb:
    image: mongo:7.0
    container_name: bigchamp-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - bigchamp-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bigchamp-app
    restart: unless-stopped
    ports:
      - "80:80"       # Ecosystem Hub & Unified Gateway
      - "3050:3050"   # FastAPI Backend & Swagger Docs (/docs)
      - "3000:3000"   # Customer Frontend Website & App
      - "3001:3001"   # Admin Console Portal
      - "3002:3002"   # Offline Partner Check-in Portal
    environment:
      - ENV=development
      - PORT=3050
      - MONGO_URI=mongodb://mongodb:27017
      - MONGO_DB_NAME=bigchamp
      - JWT_SECRET=super_secret_jwt_key_bigchamp_dev_1234567890
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=15
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - QR_SIGNING_SECRET=super_secret_qr_signing_key_bigchamp_dev_1234567890
      - CORS_ORIGINS=["http://localhost:3000", "http://localhost:3001", "http://localhost:3002", "http://localhost:3050", "http://localhost:80", "http://localhost", "http://127.0.0.1:3000", "http://127.0.0.1:3001", "http://127.0.0.1:3002", "http://127.0.0.1:3050", "http://127.0.0.1:80"]
    depends_on:
      - mongodb
    networks:
      - bigchamp-network

volumes:
  mongodb_data:

networks:
  bigchamp-network:
    driver: bridge

services:
  mongodb:
    image: mongo:7.0
    container_name: bigchamp-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - bigchamp-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bigchamp-app
    restart: unless-stopped
    ports:
      - "80:80"       # Ecosystem Hub & Unified Gateway
      - "3050:3050"   # FastAPI Backend & Swagger Docs (/docs)
      - "3000:3000"   # Customer Frontend Website & App
      - "3001:3001"   # Admin Console Portal
      - "3002:3002"   # Offline Partner Check-in Portal
    environment:
      - ENV=${ENV:-development}
      - PORT=${PORT:-3050}
      - MONGO_URI=${MONGO_URI:-mongodb+srv://anuraglawaniya0001_db_user:TUyWPN8p5Bj0Cm6x@cluster0.hhqvt0i.mongodb.net/?retryWrites=true&w=majority}
      - MONGO_DB_NAME=${MONGO_DB_NAME:-bigchamp}
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_key_bigchamp_dev_1234567890}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      - QR_SIGNING_SECRET=${QR_SIGNING_SECRET:-super_secret_qr_signing_key_bigchamp_dev_1234567890}
      - CORS_ORIGINS=${CORS_ORIGINS:-["*"]}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-rzp_test_Ts2QVBlOxhwFTu}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-gv4f7MHd9cG8tjKnb5gH8aeO}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET:-BigchampTestWebhookSecret123456}
      - PAYMENT_MODE=${PAYMENT_MODE:-test}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:-ibq3zgu8}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:-211541897473636}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:-qEkjCpQ0HM94jNByRxIJiyKSz_s}
    volumes:
      - ./backend:/app/backend
      - ./scripts:/app/scripts
      - ./backups:/app/backups
      - uploads_data:/app/backend/uploads
    depends_on:
      - mongodb
    networks:
      - bigchamp-network

volumes:
  mongodb_data:
  uploads_data:

networks:
  bigchamp-network:
    driver: bridge

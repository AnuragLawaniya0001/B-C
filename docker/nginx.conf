user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Allow generous file uploads for high-resolution sports catalog photos & campaign videos
    client_max_body_size 100M;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Gzip Compression for High-Performance Delivery
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    # =========================================================================
    # 1. MAIN CUSTOMER FRONTEND — bigchamp.in & www.bigchamp.in (Port 80)
    # =========================================================================
    server {
        listen 80;
        server_name bigchamp.in www.bigchamp.in;

        root /var/www/frontend;
        index index.html;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # SPA Routing: Fallback to index.html for React Router
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Static Assets Caching (Fingerprinted bundles & media)
        location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2|ttf)$ {
            expires 30d;
            access_log off;
            add_header Cache-Control "public, max-age=2592000, immutable";
        }

        # API Proxy to FastAPI Backend
        location /api/ {
            proxy_pass http://127.0.0.1:3050/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 90s;
        }

        # Media Uploads Directory
        location /uploads/ {
            alias /app/backend/uploads/;
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        # FastAPI Interactive Swagger Docs
        location /docs {
            proxy_pass http://127.0.0.1:3050/docs;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /openapi.json {
            proxy_pass http://127.0.0.1:3050/openapi.json;
            proxy_set_header Host $http_host;
        }
    }

    # =========================================================================
    # 2. ADMIN MANAGEMENT CONSOLE — bcpanel.bigchamp.com (Port 80)
